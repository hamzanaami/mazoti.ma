[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazoti"
version = "0.0.1"
description = "Fuel price transparency for Morocco: pump price vs purchase cost"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
